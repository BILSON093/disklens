<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DiskLens 磁盘透视</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="brand-text"><b>DiskLens</b><i>磁盘透视</i></div>
    </div>

    <nav class="tabs">
      <button class="tab active" data-mode="explorer">
        <svg viewBox="0 0 16 16"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="10.5" y="2" width="3.5" height="4" rx="1"/><rect x="2" y="10.5" width="3.5" height="3.5" rx="1"/><rect x="7" y="10.5" width="7" height="3.5" rx="1"/><rect x="10.5" y="7" width="3.5" height="2" rx="0.8"/></svg>
        <span>空间树图</span>
      </button>
      <button class="tab" data-mode="kinds">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 2.4V8l4 3.2"/></svg>
        <span>类型分析</span>
      </button>
      <button class="tab" data-mode="large">
        <svg viewBox="0 0 16 16"><path d="M3 12.5V9M6.3 12.5V5.5M9.7 12.5V7.5M13 12.5V3.5"/></svg>
        <span>大文件</span>
        <em class="badge" id="largeBadge"></em>
      </button>
      <button class="tab" data-mode="junk">
        <svg viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 9h5.8l.6-9"/></svg>
        <span>垃圾文件</span>
        <em class="badge" id="junkBadge"></em>
      </button>
      <button class="tab" data-mode="uninstall">
        <svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M3.5 4.5l.7 9h7.6l.7-9"/><path d="M6.6 7.2v4M9.4 7.2v4"/></svg>
        <span>卸载应用</span>
        <em class="badge" id="appBadge"></em>
      </button>
      <button class="tab" data-mode="duplicates">
        <svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="8" height="8" rx="1.5"/><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/></svg>
        <span>重复文件</span>
        <em class="badge" id="dupBadge"></em>
      </button>
    </nav>

    <div class="side-block">
      <label>扫描目标</label>
      <div class="target-path" id="targetPath">~</div>
      <button class="link-btn" id="btnChoose">选择目录…</button>
    </div>

    <div class="disk-card">
      <div class="disk-head"><span>可用空间</span><b id="diskFree">—</b></div>
      <div class="bar"><i id="diskBar"></i></div>
      <div class="disk-sub" id="diskSub">—</div>
    </div>

    <div class="side-legend" id="legend"></div>

    <div class="spacer"></div>
    <div class="status" id="status">准备就绪</div>
  </aside>

  <main>
    <header class="topbar">
      <div class="titles">
        <h1 id="pageTitle">空间树图</h1>
        <p id="pageSub">选择一个目录后开始扫描</p>
      </div>
      <div class="actions">
        <button class="ghost" id="btnFullDisk" title="扫描整块磁盘（已排除系统卷的重复挂载）">全盘</button>
        <button class="ghost" id="btnExport" title="导出当前视图的报告">导出</button>
        <button class="icon-btn" id="btnFolder" title="选择目录">
          <svg viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.3 1.6h4.1A1.5 1.5 0 0 1 13 6.1v5.4A1.5 1.5 0 0 1 11.5 13h-8A1.5 1.5 0 0 1 2 11.5z"/></svg>
        </button>
        <button class="primary" id="btnScan">开始扫描</button>
      </div>
    </header>

    <div class="permission-bar" id="permBar" hidden>
      <span id="permText"></span>
      <div class="spacer"></div>
      <button class="mini" id="permDetail">查看目录</button>
      <button class="mini" id="permOpen">开启完全磁盘访问</button>
      <button class="mini" id="permDismiss">知道了</button>
    </div>
    <div class="perm-detail" id="permBox" hidden></div>

    <!-- 空间树图 -->
    <section class="view" id="view-explorer">
      <div class="crumbs" id="crumbs"></div>
      <div class="treemap-wrap" id="treemapWrap">
        <canvas id="treemap"></canvas>
        <div class="tooltip" id="tooltip"></div>
        <div class="zoomHint" id="zoomHint">滚轮缩放 · 点击进入 · Esc 返回</div>
        <div class="empty" id="explorerEmpty">
          <svg viewBox="0 0 48 48"><rect x="6" y="6" width="16" height="16" rx="3"/><rect x="25" y="6" width="17" height="9" rx="3"/><rect x="25" y="18" width="17" height="4" rx="2"/><rect x="6" y="25" width="11" height="17" rx="3"/><rect x="20" y="25" width="22" height="17" rx="3"/></svg>
          <h3>还没有扫描结果</h3>
          <p>点击「开始扫描」，每一块空间的实际占用会以矩形面积呈现，颜色代表主要文件类型。</p>
        </div>
      </div>
      <div class="childlist">
        <div class="childlist-head"><span>当前目录内容</span><em id="childCount"></em></div>
        <div class="childlist-body" id="childList"></div>
      </div>
    </section>

    <!-- 类型分析 -->
    <section class="view" id="view-kinds" hidden>
      <div class="kinds-controls">
        <div class="segmented" id="kindMode">
          <button class="active" data-m="kinds">按文件类型</button>
          <button data-m="apps">按应用</button>
        </div>
        <div class="spacer"></div>
        <span class="selinfo" id="kindsSummary"></span>
      </div>
      <div class="kindlist" id="kindList"></div>
    </section>

    <!-- 大文件 -->
    <section class="view" id="view-large" hidden>
      <div class="kinds-controls">
        <label>最小体积</label>
        <div class="segmented" id="largeSize">
          <button data-size="104857600">100 MB</button>
          <button class="active" data-size="524288000">500 MB</button>
          <button data-size="1073741824">1 GB</button>
          <button data-size="5368709120">5 GB</button>
        </div>
        <div class="spacer"></div>
        <span class="selinfo" id="largeSummary">—</span>
      </div>
      <div class="table" id="largeTable"></div>
      <div class="actionbar">
        <button class="mini" id="largeSelectIdle">选中 180 天未用</button>
        <button class="mini" id="largeClear">清空选择</button>
        <div class="spacer"></div>
        <span class="selinfo" id="largeSelInfo">未选择</span>
        <button class="primary danger" id="largeTrash" disabled>移到废纸篓</button>
      </div>
    </section>

    <!-- 垃圾文件 -->
    <section class="view" id="view-junk" hidden>
      <div class="pills" id="junkPills"></div>
      <div class="chips-row">
        <div class="chips" id="junkChips"></div>
        <div class="spacer"></div>
        <div class="sortbox">
          <select class="selsort" id="junkSort">
            <option value="size">大小</option>
            <option value="name">名称</option>
            <option value="category">类别</option>
            <option value="risk">风险</option>
          </select>
          <button class="sortdir" id="junkSortDir" title="切换升序 / 降序">↓</button>
        </div>
      </div>
      <div class="table" id="junkTable"></div>
      <div class="actionbar">
        <button class="mini" id="junkSelectAll">全选</button>
        <button class="mini" id="junkSelectSafe">只选安全项</button>
        <button class="mini" id="junkClear">清空选择</button>
        <div class="spacer"></div>
        <span class="selinfo" id="junkSelInfo">未选择</span>
        <button class="primary danger" id="junkTrash" disabled>移到废纸篓</button>
      </div>
    </section>

    <!-- 卸载应用 -->
    <section class="view" id="view-uninstall" hidden>
      <div class="kinds-controls">
        <input class="search" id="appSearch" placeholder="搜索应用或 bundle id">
        <div class="spacer"></div>
        <span class="selinfo" id="appsSummary">—</span>
        <div class="sortbox">
          <select class="selsort" id="appSort">
            <option value="size">占用空间</option>
            <option value="used">最近使用</option>
            <option value="installed">安装时间</option>
            <option value="name">名称</option>
          </select>
          <button class="sortdir" id="appSortDir" title="切换升序 / 降序">↓</button>
        </div>
        <button class="primary" id="appsRefresh">重新分析</button>
      </div>
      <div class="dup-body">
        <div class="applist" id="appList"></div>
        <aside class="preview" id="appPreview">
          <div class="preview-empty">
            <svg viewBox="0 0 40 40"><rect x="7" y="7" width="26" height="26" rx="7"/><path d="M14 26V14h8a4 4 0 0 1 0 8h-8"/></svg>
            <p>从左侧选择一个应用<br>查看它能清理哪些残留</p>
          </div>
        </aside>
      </div>
      <div class="actionbar">
        <span class="selinfo" id="appSelInfo">选择一个应用查看详情</span>
        <div class="spacer"></div>
        <button class="primary danger" id="appUninstall" disabled>卸载并清理残留</button>
      </div>
    </section>

    <!-- 重复文件 -->
    <section class="view" id="view-duplicates" hidden>
      <div class="dup-controls">
        <div class="segmented" id="dupMode">
          <button class="active" data-m="exact">完全重复</button>
          <button data-m="similar">相似照片</button>
        </div>
        <label style="margin-left:4px">最小体积</label>
        <div class="segmented" id="dupSize">
          <button data-size="102400">100 KB</button>
          <button class="active" data-size="1048576">1 MB</button>
          <button data-size="10485760">10 MB</button>
          <button data-size="104857600">100 MB</button>
        </div>
        <div class="spacer"></div>
        <div class="sortbox">
          <select class="selsort" id="dupSort">
            <option value="reclaim">可回收空间</option>
            <option value="size">单个大小</option>
            <option value="count">文件数</option>
            <option value="name">名称</option>
          </select>
          <button class="sortdir" id="dupSortDir" title="切换升序 / 降序">↓</button>
        </div>
        <button class="primary" id="dupScan">开始查重</button>
      </div>
      <div class="dup-progress" id="dupProgress" hidden>
        <div class="bar"><i id="dupBar"></i></div>
        <span id="dupProgressText"></span>
      </div>
      <div class="dup-body">
        <div class="duplist" id="dupList"></div>
        <aside class="preview" id="dupPreview">
          <div class="preview-empty">
            <svg viewBox="0 0 40 40"><rect x="6" y="6" width="12" height="12" rx="2.5"/><rect x="22" y="6" width="12" height="12" rx="2.5"/><rect x="6" y="22" width="12" height="12" rx="2.5"/><rect x="22" y="22" width="12" height="12" rx="2.5"/></svg>
            <p>点击左侧任意文件<br>在这里查看预览与详情</p>
          </div>
        </aside>
      </div>
      <div class="actionbar">
        <button class="mini" id="dupSelectAll">全选可删项</button>
        <button class="mini" id="dupClear">清空选择</button>
        <span class="selinfo" id="dupSelInfo" style="margin-left:6px">每组默认保留最新的一份</span>
        <div class="spacer"></div>
        <button class="primary danger" id="dupTrash" disabled>清理选中</button>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
